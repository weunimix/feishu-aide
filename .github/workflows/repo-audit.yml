name: Repo audit

# 仓库设置不在 git 里：改 ruleset / allowlist / secret scanning 没有 diff。
# 这里每周把线上值与本仓库的基线比对；值变了就红，逼人看一眼是不是有意为之。
on:
  schedule:
    # 每周一 09:00 Asia/Shanghai（UTC+8）
    - cron: "0 1 * * 1"
  workflow_dispatch:

concurrency:
  group: repo-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Repo settings drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # GITHUB_TOKEN 没有 Administration 权限，读不到 ruleset / allowlist。
      # 未配置 REPO_AUDIT_TOKEN 时不伪装成"已审计"：发一条 warning，让人看得见这个缺口。
      - name: 对比线上设置与基线
        env:
          REPO_AUDIT_TOKEN: ${{ secrets.REPO_AUDIT_TOKEN }}
        run: |
          if [ -z "$REPO_AUDIT_TOKEN" ]; then
            echo "::warning::未配置 REPO_AUDIT_TOKEN，漂移检测被跳过；这不是通过，是没检查。"
            echo "创建只读 Administration + Metadata 的 fine-grained PAT 并写入 secret 后才会真正断言；本地可用 GH_TOKEN 跑 pnpm repo:audit。"
            exit 0
          fi
          node scripts/check-repo-settings.mjs
