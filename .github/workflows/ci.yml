name: CI

# 供应链：action 固定到完整 commit SHA（行尾注释版本），升级由 Dependabot
# 每周提 PR；不要写回 @vN，标签可以被上游移动。

# P2/P3: offline checks only. 真实飞书验证需要人在浏览器里完成设备流授权，
# 不进入 CI；其余（fake server 集成、插件装配 smoke、打包校验）都已离线覆盖。
# 不加空 step：没有断言就绿是假绿。
on:
  push:
    branches: [main]
  # 不限制 base 分支：堆叠 PR（基于另一个未合并分支）同样需要验证，
  # 否则「等到 rebase 到 main 再跑」会把问题推迟到合并前最后一次改动。
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      # 三个 OS 跑同一套检查。防的失败模式：本仓库在 Windows 上开发、此前只在
      # Linux + Windows 验证，macOS 用户的路径大小写、POSIX 权限位（0600）、
      # CRLF 与 locale 差异没有任何门禁；插件是宿主进程内加载的纯 JS 包，
      # 这些差异一旦回归只会暴露在真实 macOS 用户那里。加一个 job 的代价是
      # 几分钟 runner 时间，比在用户机器上发现便宜。
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # 卡住的步骤默认能占满 6 小时；这套检查本机与 CI 都在 1 分钟内跑完。
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # pnpm/action-setup reads the pinned version from package.json's
      # packageManager field; also passing `version` makes it error.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # No dependencies needed: a leaked token should fail before installation.
      - name: Secret scan
        run: node scripts/check-secrets.mjs

      # Policy code is plain ESM; test it before the package manager can fail.
      - name: Branch cleanup and secret-scan policy tests
        run: pnpm test:policy

      # 文档块映射：零依赖，只断言可验证的事实（src 引用存在、src/ 覆盖率、
      # 生成的 doc-map.json 与提交版一致），不判断文档内容是否「写对了」。
      - name: Doc block map
        run: node scripts/check-docs.mjs

      # 版本漂移：README 的安装地址指向的 tag/文件名必须等于 package.json 的版本。
      # 防的失败模式是「改了版本号、忘了改 README」，用户照 README 装到旧 tarball。
      - name: Release version
        run: node scripts/check-release-version.mjs

      - run: pnpm install --frozen-lockfile --engine-strict

      # 运行时依赖漏洞门禁：只看 production 闭包——发布物不带 node_modules，
      # 用户装到的是 dependencies 解析出的树，devDependencies 的告警（例如经
      # @deepseek-ai/dsh-tools 传入的 zod）不该让发布门禁变红。防的失败模式是
      # 上游运行时依赖出了高危漏洞，因为没人盯 registry 而继续随新 tarball
      # 发出去（用户机器上重新解析版本，CI 不重新解析就发现不了）。
      # pnpm audit 自己的退出码只表示「有没有任何级别的发现」，阈值判断在脚本
      # 里，所以用 `|| true` 让脚本成为唯一决策者；命令崩溃或输出不可解析时
      # 脚本以退出码 2 失败，不会静默放行。
      - name: Audit production dependencies
        run: |
          { pnpm audit --prod --json || true; } | node scripts/check-audit.mjs

      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

      # 打包校验：tarball 必须带 dist 入口与 cordis.patch.yml、不得含 src/test，
      # 且 dist 里不能出现 src 已删除文件的陈旧产物。防的失败模式是「删了源码、
      # 忘了清 dist，旧 .js 跟着发布物进用户 node_modules」——本机构建不清 dist
      # 时不会暴露，只有真打过旧包的人才会带着幽灵文件发版。
      - name: Pack check
        run: pnpm pack:check

      # Only build output and redacted logs are uploaded. Never upload the
      # local document cache: it can contain tenant content.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failure-${{ matrix.os }}
          path: |
            dist/
            logs/
          retention-days: 7
          if-no-files-found: ignore
